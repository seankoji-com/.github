name: Reusable ShellSpec

on:
  workflow_call:
    inputs:
      # Omitted runner-json routes by repository visibility: private repos
      # get the self-hosted labels below, public repos get ubuntu-latest.
      # github.event.repository.private decides for every event that carries
      # a repository (all except schedule). A schedule payload has none, so
      # the org variable PRIVATE_REPO_SELF_HOSTED, visible only to private
      # repositories, decides there. A public repo's events never read the
      # variable, so fork pull requests cannot reach an organization runner.
      # The private default pins the mint pool because its runner image bakes
      # in zsh; other Linux pools may lack zsh and the sudo needed to install it.
      runner-json:
        description: 'JSON runner labels. Omitted: ["self-hosted","Linux","X64","mint"] in private repos, ubuntu-latest in public ones. The runner needs zsh or passwordless sudo apt-get.'
        type: string
        default: ${{ (github.event.repository.private || (!github.event.repository && vars.PRIVATE_REPO_SELF_HOSTED == 'true')) && '["self-hosted","Linux","X64","mint"]' || '["ubuntu-latest"]' }}

permissions:
  contents: read

jobs:
  test:
    name: ShellSpec
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zsh
          fi
      - name: Fetch pinned ShellSpec
        env:
          SHELLSPEC_SHA: 90e48c950239f3b8a9fdfa3e869592872c77b981 # 0.28.1
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/shellspec/shellspec/archive/${SHELLSPEC_SHA}.tar.gz" \
            --output "$RUNNER_TEMP/shellspec.tar.gz"
          mkdir -p "$RUNNER_TEMP/shellspec"
          tar -xzf "$RUNNER_TEMP/shellspec.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/shellspec"
      - name: Run ShellSpec
        run: '"$RUNNER_TEMP/shellspec/shellspec" --format documentation'
