name: Request persona recovery

# The caller runs on pull_request_target and passes only repository, PR number,
# and head SHA. No PR code is checked out and no diff enters Actions logs.
on:
  workflow_call:
    inputs:
      target_repository:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
    secrets:
      # Optional so a repo without the key still parses and runs; the
      # credentials step below turns the whole job into a no-op instead.
      SEANKOJI_CI_PRIVATE_KEY:
        required: false

jobs:
  request:
    # This job handles an App private key, so it never runs on the shared
    # pool that also executes pull-request code. It runs on the runners named
    # by the org Actions variable PERSONA_RECOVERY_RUNS_ON, whose value is
    # ["self-hosted","persona-recovery"]: ephemeral, single-use JIT runners in
    # the dedicated persona-recovery runner group. That group is open to all
    # repositories, including private ones, with workflow access restricted to
    # seankoji-com/.github/.github/workflows/reusable-persona-recovery-request.yml@refs/heads/main.
    # Its runners take no other workloads. The job needs
    # bash, curl, jq, gh and the runner's bundled Node (for
    # create-github-app-token). Repository variables override org variables;
    # accept only the contracted JSON string to prevent shared-pool routing.
    # While the variable is unset or has any other value, the job falls
    # back to a fresh GitHub-hosted runner, so merging this before the runner
    # group exists cannot strand jobs in the queue. If scheduling fails, none
    # of the step-level warnings run. The private controller's scheduled
    # sweep (every 15 minutes) can dispatch missing reviews independently,
    # subject to active-run/retry limits and available self-hosted capacity.
    if: ${{ vars.PERSONA_RECOVERY_RUNS_ON == '["self-hosted","persona-recovery"]' }}
    runs-on: ${{ vars.PERSONA_RECOVERY_RUNS_ON == '["self-hosted","persona-recovery"]' && fromJSON(vars.PERSONA_RECOVERY_RUNS_ON) || 'ubuntu-latest' }} # runner-keep-hosted (fallback while PERSONA_RECOVERY_RUNS_ON is unset/invalid; App private-key isolation)
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Callers cannot test `secrets` in a job-level `if`, so the presence
      # check lives here.
      - name: Check recovery credentials
        id: credentials
        continue-on-error: true
        env:
          HAS_KEY: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = true ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::SEANKOJI_CI_PRIVATE_KEY is not available here; skipping persona recovery'
          fi
      - name: Validate target
        id: validate
        if: steps.credentials.outputs.configured == 'true'
        continue-on-error: true # advisory during rollout
        env:
          TARGET_REPO: ${{ inputs.target_repository }}
          TARGET_PR: ${{ inputs.pr_number }}
          TARGET_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_REPO" =~ ^seankoji-com/[A-Za-z0-9_.-]+$ ]]; then
            echo '::error::Target repository validation failed'
            exit 1
          fi
          if ! [[ "$TARGET_PR" =~ ^[1-9][0-9]{0,11}$ ]]; then
            echo '::error::Target PR number validation failed'
            exit 1
          fi
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Target head SHA validation failed'
            exit 1
          fi
      - name: Mint private controller dispatch token
        id: token
        if: steps.validate.outcome == 'success'
        continue-on-error: true # the required gate still waits for a verdict
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SEANKOJI_CI_APP_ID }}
          private-key: ${{ secrets.SEANKOJI_CI_PRIVATE_KEY }}
          owner: seankoji-com
          repositories: .github-private
      - name: Request review recovery for this head
        id: dispatch
        if: steps.token.outcome == 'success'
        continue-on-error: true # failure is visible in the gate's waiting alert
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.target_repository }}
          TARGET_PR: ${{ inputs.pr_number }}
          TARGET_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          current_head=$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${TARGET_REPO}/pulls/${TARGET_PR}" --jq '.head.sha // ""' 2>/dev/null || echo "$TARGET_SHA")
          if [ -n "$current_head" ] && [ "$current_head" != "$TARGET_SHA" ]; then
            echo "::notice::PR head has moved from ${TARGET_SHA} to ${current_head}; skipping persona recovery for superseded head"
            exit 0
          fi

          workflow='repos/seankoji-com/.github-private/actions/workflows/persona-review-reconcile.yml/runs?event=repository_dispatch&per_page=30'
          expected="Persona recovery ${TARGET_REPO}#${TARGET_PR} @ ${TARGET_SHA}"

          runs_json=$(gh api "$workflow" 2>/dev/null || echo '{"workflow_runs":[]}')
          if jq -e --arg title "$expected" \
               'any(.workflow_runs[]; .display_title == $title and (.status == "queued" or .status == "in_progress"))' <<<"$runs_json" >/dev/null; then
            echo "::notice::Active recovery run for this exact head is already in flight; skipping dispatch"
            exit 0
          fi

          for attempt in 1 2; do
            echo "::notice::Recovery delivery attempt $attempt"
            runs_json=$(gh api "$workflow" 2>/dev/null || echo '{"workflow_runs":[]}')
            before=$(jq '[.workflow_runs[].id] | max // 0' <<<"$runs_json")
            jq -n --arg repo "$TARGET_REPO" --argjson pr "$TARGET_PR" \
              --arg sha "$TARGET_SHA" \
              '{event_type:"persona-review-reconcile-requested",
                client_payload:{repository:$repo,pull_number:$pr,head_sha:$sha}}' \
              | gh api -X POST repos/seankoji-com/.github-private/dispatches --input - >/dev/null

            for _ in 1 2 3 4 5 6; do
              sleep 10
              runs_json=$(gh api "$workflow" 2>/dev/null || echo '{"workflow_runs":[]}')
              if jq -e --arg title "$expected" --argjson before "$before" \
                   'any(.workflow_runs[]; .id > $before and .display_title == $title and (.status == "queued" or .status == "in_progress" or .status == "completed" or .status == "pending" or .status == "waiting"))' <<<"$runs_json" >/dev/null; then
                exit 0
              fi
            done
          done

          echo '::error::Private persona recovery dispatch was accepted but no matching workflow run appeared'
          echo "Recent workflow runs in .github-private:"
          jq -r '.workflow_runs[:5][] | "id=\(.id) status=\(.status) conclusion=\(.conclusion) title=\(.display_title)"' <<<"$runs_json" || true
          exit 1
      - name: Show delivery warning
        if: always() && steps.credentials.outputs.configured == 'true' && (steps.validate.outcome != 'success' || steps.token.outcome != 'success' || steps.dispatch.outcome != 'success')
        run: echo '::warning::Persona recovery signal failed; the review gate will keep waiting and the scheduled sweep can retry'
