name: Reusable Agent Readiness

# Ratchet, not a bar. Scores the PR's merge-base and its head with
# scripts/agent_readiness.py and reports only what the PR made worse: a new
# CLAUDE.md/AGENTS.md split, a file newly pushed over the line limit or grown
# past tolerance, a doc or .claude/ command now pointing at a missing path.
# Existing debt never fails a PR. Standard and check list: docs/agent-readiness.md.
#
# Advisory by default: the job exits 0 unless the repo's .agent-readiness.json
# sets "enforce": true, so a wrong finding can never freeze the fleet — the
# opt-in, the opt-out, and dated waivers all live in the repo under test and
# take effect in the same PR. No hub round-trip, no redistribution.
#
# The caller chooses the runner. The safe default is GitHub-hosted because a
# public pull request must never execute untrusted code on an organization
# runner.

on:
  workflow_call:
    inputs:
      runner-json:
        description: 'JSON runner labels. Private callers may opt into self-hosted runners.'
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  agent-readiness:
    name: agent-readiness
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the checker scores the merge-base with the base
          # branch, and a shallow clone has no such commit to find.
          fetch-depth: 0
          persist-credentials: false

      - name: Stage the checker
        id: stage
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # A checker that cannot be staged is fatal ONLY for a repo that
          # opted into enforcement. An advisory repo cannot fix a missing org
          # secret or a hub outage in its own PR, so it gets a warning and a
          # green skip — the same escape hatch the checker itself honours.
          unavailable() {
            enforce="$(python3 -c 'import json;print(json.load(open(".agent-readiness.json")).get("enforce", False))' 2>/dev/null || echo False)"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### Agent readiness unavailable\n\nReason: %s\n\nEnforced: %s\n' "$1" "$enforce" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$enforce" = "True" ]; then
              echo "::error::agent-readiness checker unavailable: $1 (this repo enforces)"; exit 1
            fi
            echo "::warning::agent-readiness checker unavailable: $1 — advisory repo, skipping"
            echo "staged=false" >> "$GITHUB_OUTPUT"; exit 0
          }
          # The hub's own caller may use the same-commit relative form. In that
          # case the checkout already contains the checker under test.
          if [ "${GITHUB_REPOSITORY}" = "seankoji-com/.github" ] && [ -f scripts/agent_readiness.py ]; then
            cp scripts/agent_readiness.py "${RUNNER_TEMP}/agent_readiness.py"
            echo "hub repo: using the checked-out checker"
            echo "staged=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! echo "${JOB_WORKFLOW_SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            unavailable "missing or invalid job.workflow_sha"
          fi
          REF="${JOB_WORKFLOW_SHA}"
          curl -fsS \
            "https://raw.githubusercontent.com/seankoji-com/.github/${REF}/scripts/agent_readiness.py" \
            -o "${RUNNER_TEMP}/agent_readiness.py" \
            || unavailable "fetch at ref ${REF} failed"
          [ -s "${RUNNER_TEMP}/agent_readiness.py" ] || unavailable "fetched file is empty"
          echo "staged=true" >> "$GITHUB_OUTPUT"

      # --ci: merge-base ratchet, step-summary table, and the enforce gate,
      # all inside the script so the public export runs the identical logic.
      - name: Score merge-base and head
        if: steps.stage.outputs.staged == 'true'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 "${RUNNER_TEMP}/agent_readiness.py" --ci --root .
