name: Reusable Agent Readiness

# Ratchet, not a bar. Scores the PR's merge-base and its head with
# scripts/agent_readiness.py and reports only what the PR made worse: a new
# CLAUDE.md/AGENTS.md split, a file newly pushed over the line limit or grown
# past tolerance, a doc or .claude/ command now pointing at a missing path.
# Existing debt never fails a PR. Standard and check list: docs/agent-readiness.md.
#
# Advisory by default: the job exits 0 unless the repo's .agent-readiness.json
# sets "enforce": true, so a wrong finding can never freeze the fleet — the
# opt-in, the opt-out, and dated waivers all live in the repo under test and
# take effect in the same PR. No hub round-trip, no redistribution.
#
# Explicit caller labels override routing. Private omissions use self-hosted
# runners through the private-only org variable; public callers stay hosted.

on:
  workflow_call:
    inputs:
      # Omitted input uses capability-specific self-hosted labels when the org
      # Actions variable PRIVATE_REPO_SELF_HOSTED is true (access: Private
      # repositories only). Caller vars work for every event, including schedule;
      # no event payload is needed. Public/unconfigured callers stay hosted.
      # Explicit runner-json always wins. See README.md#runner-selection.
      runner-json:
        description: 'JSON runner labels. Omitted: ["self-hosted","Linux"] when PRIVATE_REPO_SELF_HOSTED=true, otherwise ubuntu-latest. Explicit labels override routing.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  agent-readiness:
    name: agent-readiness
    runs-on: ${{ fromJSON((inputs.runner-json != '' && inputs.runner-json) || (vars.PRIVATE_REPO_SELF_HOSTED == 'true' && '["self-hosted","Linux"]') || '["ubuntu-latest"]') }} # runner-keep-hosted (fallback for public callers and while PRIVATE_REPO_SELF_HOSTED is unset/false)
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Prepare isolated checkout
        id: workspace
        shell: bash
        run: |
          if [[ "$GITHUB_WORKSPACE" == / || "$GITHUB_WORKSPACE" != "$(pwd -P)" ]]; then
            echo "::error::Refusing to use a non-canonical GitHub workspace"
            exit 1
          fi

          # Older readiness jobs left partial clones at the workspace root.
          # Removing just their Git metadata lets the next root checkout rebuild
          # with credentials. Clearing config alone would leave missing objects.
          git_dir="$GITHUB_WORKSPACE/.git"
          config="$git_dir/config"
          if [[ -L "$git_dir" || -L "$config" ]]; then
            echo "::error::Refusing to inspect symlinked workspace Git metadata"
            exit 1
          fi
          if [[ -d "$git_dir" && -f "$config" ]]; then
            cfg=(git config --file "$config" --no-includes)
            if [[ "$("${cfg[@]}" --type=bool --get remote.origin.promisor 2>/dev/null)" == true ]] ||
               "${cfg[@]}" --get remote.origin.partialclonefilter >/dev/null ||
               "${cfg[@]}" --get extensions.partialClone >/dev/null; then
              echo "::notice::Removing partial-clone metadata from the workspace root for the next checkout"
              rm -rf -- "$git_dir"
            fi
          fi

          # Reserve a fresh path inside the workspace, as actions/checkout
          # requires. A cancelled job's leftover clone will never be reused.
          checkout="$(mktemp -d "$GITHUB_WORKSPACE/.agent-readiness.XXXXXXXX")"
          printf 'path=%s\n' "${checkout##*/}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checker fetches only this commit's and the base branch's
          # histories; historical blobs, unrelated branches and tags stay remote.
          path: ${{ steps.workspace.outputs.path }}
          fetch-depth: 1
          filter: blob:none
          lfs: false
          persist-credentials: false

      - name: Stage the checker
        id: stage
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # A checker that cannot be staged is fatal ONLY for a repo that
          # opted into enforcement. An advisory repo cannot fix a missing org
          # secret or a hub outage in its own PR, so it gets a warning and a
          # green skip — the same escape hatch the checker itself honours.
          unavailable() {
            enforce="$(python3 -c 'import json;print(json.load(open(".agent-readiness.json")).get("enforce", False))' 2>/dev/null || echo False)"
            printf 'staged=false\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '### Agent readiness unavailable\n\nReason: %s\n\nEnforced: %s\n' "$1" "$enforce" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$enforce" = "True" ]; then
              echo "::error::agent-readiness checker unavailable: $1 (this repo enforces)"; exit 1
            fi
            echo "::warning::agent-readiness checker unavailable: $1 — advisory repo, skipping"
            exit 0
          }
          # The hub's own caller may use the same-commit relative form. In that
          # case the checkout already contains the checker under test.
          if [ "${GITHUB_REPOSITORY}" = "seankoji-com/.github" ] && [ -f scripts/agent_readiness.py ]; then
            for file in agent_readiness.py agent_readiness_git.py; do
              [ -s "scripts/${file}" ] || unavailable "missing ${file} in hub checkout"
              cp "scripts/${file}" "${RUNNER_TEMP}/${file}"
            done
            echo "hub repo: using the checked-out checker"
            echo "staged=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ ! "${JOB_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            unavailable "missing or invalid job.workflow_sha"
          fi
          REF="${JOB_WORKFLOW_SHA}"
          for file in agent_readiness.py agent_readiness_git.py; do
            curl -fsS --connect-timeout 10 --max-time 30 \
              "https://raw.githubusercontent.com/seankoji-com/.github/${REF}/scripts/${file}" \
              -o "${RUNNER_TEMP}/${file}" \
              || unavailable "fetch of ${file} at ref ${REF} failed"
            [ -s "${RUNNER_TEMP}/${file}" ] || unavailable "fetched ${file} is empty"
          done
          echo "staged=true" >> "$GITHUB_OUTPUT"

      # --ci: merge-base ratchet, step-summary table, and the enforce gate,
      # all inside the script so the public export runs the identical logic.
      - name: Score merge-base and head
        if: steps.stage.outputs.staged == 'true'
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          AGENT_READINESS_GIT_TOKEN: ${{ github.token }}
        run: |
          python3 "${RUNNER_TEMP}/agent_readiness.py" --ci --root .

      - name: Remove isolated checkout
        if: always()
        shell: bash
        env:
          CHECKOUT_PATH: ${{ steps.workspace.outputs.path }}
        run: |
          # No path was allocated if preparation failed before mktemp.
          if [[ -z "$CHECKOUT_PATH" ]]; then
            exit 0
          fi
          if [[ "$GITHUB_WORKSPACE" == / || "$GITHUB_WORKSPACE" != "$(pwd -P)" ||
                ! "$CHECKOUT_PATH" =~ ^\.agent-readiness\.[A-Za-z0-9]{8}$ ||
                -L "$GITHUB_WORKSPACE/$CHECKOUT_PATH" ]]; then
            echo "::error::Refusing to remove an unsafe agent readiness checkout path"
            exit 1
          fi
          rm -rf -- "${GITHUB_WORKSPACE:?}/${CHECKOUT_PATH:?}"
