name: Reusable Issue Triage & PR Sync

on:
  workflow_call:
    inputs:
      triage-label:
        description: 'Label to apply on new issues needing triage'
        type: string
        default: 'needs-triage'
      bypass-label:
        description: 'Label that bypasses triage labeling'
        type: string
        default: 'ready'
      runner-json:
        description: 'JSON runner labels. Self-hosted runners must be v2.327.1 or newer for github-script v9.'
        type: string
        default: '["ubuntu-latest"]'

permissions:
  issues: write
  pull-requests: read

jobs:
  triage-issue:
    name: Auto-label New Issue
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 5
    steps:
      - name: Add triage label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BYPASS_LABEL: ${{ inputs.bypass-label }}
          TRIAGE_LABEL: ${{ inputs.triage-label }}
        with:
          script: |
            const number = context.payload.issue.number;
            const labels = (context.payload.issue.labels ?? []).map(l => l.name);
            const bypass = process.env.BYPASS_LABEL;
            const triage = process.env.TRIAGE_LABEL;
            
            if (labels.includes(bypass)) {
              core.info(`#${number} already has "${bypass}"; skipping "${triage}".`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels: [triage],
            });
            core.info(`Added "${triage}" to #${number}.`);

  link-pr:
    name: Auto-label Issue with Linked PR
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 5
    steps:
      - name: Mark referenced issue as having PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prBody = context.payload.pull_request.body || '';
            const issueMatches = prBody.match(/(?:closes|fixes|resolves|refs)\s+#(\d+)/gi);
            if (!issueMatches) return;
            
            for (const match of issueMatches) {
              const issueNum = match.match(/\d+/)[0];
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNum, 10),
                  labels: ['has-pr'],
                });
                core.info(`Added "has-pr" to issue #${issueNum}`);
              } catch (err) {
                core.warning(`Could not label issue #${issueNum}: ${err.message}`);
              }
            }
