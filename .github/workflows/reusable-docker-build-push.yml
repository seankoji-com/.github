name: Reusable GHCR Docker Build & Push

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Full image name (e.g. ghcr.io/seankoji-com/my-service)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: 'Dockerfile'
      context:
        description: 'Build context path'
        type: string
        default: '.'
      push:
        description: 'Whether to push the image to registry'
        type: boolean
        default: true
      extra-tags:
        description: 'Additional tags (comma separated)'
        type: string
        default: ''
      cache-scope:
        description: 'GHA cache scope; defaults to image-name. Letters, digits, dot, underscore, slash, colon, @ and hyphen only.'
        type: string
        default: ''
      runner-json:
        description: 'JSON runner labels. Private callers may opt into self-hosted runners.'
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Docker Build & Push
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 30
    env:
      CACHE_SCOPE: ${{ inputs.cache-scope || inputs.image-name }}
    steps:
      - name: Validate cache scope
        run: |
          if [[ ! "$CACHE_SCOPE" =~ ^[A-Za-z0-9][A-Za-z0-9._/@:-]*$ ]]; then
            echo '::error::Cache scope must be nonempty and contain only letters, digits, dot, underscore, slash, colon, @ or hyphen.'
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            ${{ inputs.extra-tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
