name: Reusable Released-to-Prod Marker

# Standard "released to prod" signal, called after a repository's deployment
# succeeds. It creates a Deployment for the requested commit and immediately
# marks it successful, which emits the standard `deployment_status` event.
#
# The token used is the default job GITHUB_TOKEN, scoped by `workflow_call`
# semantics to the CALLING repository — the deployment is always created
# against the caller's own repo, so no cross-repo GitHub App token is needed
# here. The caller must grant `deployments: write` because the organization
# default is read-only.

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA that was deployed. Defaults to the calling job''s github.sha when omitted or empty.'
        type: string
        default: ''
      environment:
        description: 'Deployment environment name'
        type: string
        default: 'prod'
      description:
        description: 'Optional human-readable description recorded on the deployment and its status'
        type: string
        default: 'Released via seankoji-com/.github released.yml'
      # Omitted runner-json routes by repository visibility: private repos
      # get the self-hosted labels below, public repos get ubuntu-latest.
      # github.event.repository.private decides for every event that carries
      # a repository (all except schedule). A schedule payload has none, so
      # the org variable PRIVATE_REPO_SELF_HOSTED, visible only to private
      # repositories, decides there. A public repo's events never read the
      # variable, so fork pull requests cannot reach an organization runner.
      runner-json:
        description: 'JSON runner labels. Omitted: ["self-hosted","Linux"] in private repos, ubuntu-latest in public ones. Self-hosted runners must be v2.327.1 or newer for github-script v9.'
        type: string
        default: ${{ (github.event.repository.private || (!github.event.repository && vars.PRIVATE_REPO_SELF_HOSTED == 'true')) && '["self-hosted","Linux"]' || '["ubuntu-latest"]' }}

permissions:
  contents: read
  deployments: write

jobs:
  mark-released:
    name: Mark released to ${{ inputs.environment }}
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 5
    steps:
      - name: Create deployment and success status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_DESCRIPTION: ${{ inputs.description }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA.trim() || context.sha;
            const environment = process.env.RELEASE_ENVIRONMENT;
            const description = process.env.RELEASE_DESCRIPTION;

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment,
              auto_merge: false,
              required_contexts: [],
              description,
            });

            const deploymentId = deployment.data && deployment.data.id;
            if (!deploymentId) {
              core.setFailed(`Deployment creation did not return an id (status ${deployment.status}): ${JSON.stringify(deployment.data)}`);
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              description,
              environment,
            });

            core.info(`Marked ${sha} as released to ${environment} (deployment ${deploymentId}).`);
