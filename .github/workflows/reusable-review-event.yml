name: Review state changed

# A fork review event cannot post checks. Finish a read-only signal so the
# caller's workflow_run handler can evaluate using trusted default-branch code.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  signal:
    # Private repos run on the self-hosted pool so an exhausted Actions budget
    # cannot stop the signal. Org runner groups do not serve public repos, and
    # hosted minutes are free there, so public repos stay on ubuntu-latest.
    # These CPU-only jobs must use the shared Linux pool so a single
    # unavailable host cannot strand review signals or recovery requests.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux"]') || 'ubuntu-latest' }} # runner-keep-hosted (public repos only)
    timeout-minutes: 2
    steps:
      - name: Signal review state change
        run: echo "Review state changed; the default-branch gate will reevaluate."
