name: Reusable PR Gatekeeper

# Posts the single aggregator check run `gatekeeper / all-checks-passed` for a
# commit. It blocks on ANY red check, not only the ones a repo happens to have
# listed as required. This closes the gap where an unlisted failing check can
# otherwise be ignored by branch protection.
#
# The check run is created by the CALLER repo's own GITHUB_TOKEN, never by the
# organization CI App: two identities posting the same check name yields two
# check runs with that name and makes the ruleset's context match ambiguous.
# The evaluator is fetched from the same immutable revision as this public
# reusable workflow.

on:
  workflow_call:
    inputs:
      head_sha:
        description: 'Commit SHA to evaluate and report the gate against.'
        required: true
        type: string
      review_run_id:
        description: 'Review signal run to resolve through trusted GitHub metadata.'
        type: string
        default: ''
      runner-json:
        description: 'JSON runner labels. Private callers may opt into self-hosted runners.'
        type: string
        default: '["ubuntu-latest"]'
      seed:
        description: 'Post an in-progress seed check and exit without evaluating.'
        type: boolean
        default: false
      persona_state:
        description: 'Private controller signal for the Grumpy review job.'
        type: string
        default: ''
      persona_pr:
        description: 'PR number for the exact-head persona signal.'
        type: string
        default: ''

# Inherit the caller's explicit token permissions. Requiring a new scope here
# before fleet callers receive it would make older callers fail to resolve.
# Updated callers grant statuses: read; older callers still fail closed on an
# unreadable status API without turning a permission rollout into a syntax error.

jobs:
  all-checks-passed:
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 10
    steps:
      - name: Stage the evaluator
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "${JOB_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing or invalid job.workflow_sha"
            exit 1
          fi
          REF="${JOB_WORKFLOW_SHA}"
          curl -fsS \
            "https://raw.githubusercontent.com/seankoji-com/.github/${REF}/scripts/pr-gatekeeper.py" \
            -o "${RUNNER_TEMP}/pr-gatekeeper.py" \
            || { echo "::error::failed to fetch pr-gatekeeper.py at ref ${REF}"; exit 1; }
          [ -s "${RUNNER_TEMP}/pr-gatekeeper.py" ] || {
            echo "::error::fetched pr-gatekeeper.py is empty"; exit 1;
          }

      - name: Evaluate and post the gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONA_REVIEW_REQUIRED: ${{ vars.PERSONA_REVIEW_REQUIRED }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SEED: ${{ inputs.seed }}
          PERSONA_STATE: ${{ inputs.persona_state }}
          PERSONA_PR: ${{ inputs.persona_pr }}
        run: |
          # review_run_id is caller-supplied public API and --review-run is
          # type=int: any non-integer would kill the step on argparse's usage
          # error before the gate script runs, posting no check run at all.
          # Guard the shape (as JOB_WORKFLOW_SHA does above) and fall back to
          # plain --sha evaluation so a bad value cannot suppress the check.
          args=()
          if [ -n "$REVIEW_RUN_ID" ]; then
            # Match the whole string, not one line of it: a multiline value
            # such as $'123\ninvalid' would satisfy a per-line grep and still
            # reach argparse. Cap the length too; run ids are ~10 digits.
            if [[ "$REVIEW_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
              args+=(--review-run "$REVIEW_RUN_ID")
            else
              echo "::warning::Ignoring invalid review_run_id '${REVIEW_RUN_ID}'; evaluating by --sha"
            fi
          fi
          if [ "$SEED" = "true" ]; then args+=(--seed); fi
          if [[ "$PERSONA_STATE" =~ ^(running|failed)$ ]] && [[ "$PERSONA_PR" =~ ^[1-9][0-9]{0,11}$ ]]; then
            args+=(--persona-state "$PERSONA_STATE" --persona-pr "$PERSONA_PR")
          elif [ -n "$PERSONA_STATE" ] || [ -n "$PERSONA_PR" ]; then
            echo '::warning::Invalid persona signal inputs; continuing without persona signal'
          fi
          python3 "${RUNNER_TEMP}/pr-gatekeeper.py" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${HEAD_SHA}" "${args[@]}"
