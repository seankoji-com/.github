name: Reusable PR Gatekeeper

# Posts the single aggregator check run `gatekeeper / all-checks-passed` for a
# commit. It blocks on ANY red check, not only the ones a repo happens to have
# listed as required. This closes the gap where an unlisted failing check can
# otherwise be ignored by branch protection.
#
# The check run is created by the CALLER repo's own GITHUB_TOKEN, never by the
# organization CI App: two identities posting the same check name yields two
# check runs with that name and makes the ruleset's context match ambiguous.
# The evaluator is fetched from the same immutable revision as this public
# reusable workflow.

on:
  workflow_call:
    inputs:
      head_sha:
        description: 'Commit SHA to evaluate and report the gate against.'
        required: true
        type: string
      review_run_id:
        description: 'Review signal run to resolve through trusted GitHub metadata.'
        type: string
        default: ''
      # Omitted input uses capability-specific self-hosted labels when the org
      # Actions variable PRIVATE_REPO_SELF_HOSTED is true (access: Private
      # repositories only). Caller vars work for every event, including schedule;
      # no event payload is needed. Public/unconfigured callers stay hosted.
      # Explicit runner-json always wins. See README.md#runner-selection.
      runner-json:
        description: 'JSON runner labels. Omitted: ["self-hosted","Linux"] when PRIVATE_REPO_SELF_HOSTED=true, otherwise ubuntu-latest. Explicit labels override routing.'
        type: string
        default: ''
      seed:
        description: 'Post an in-progress seed check and exit without evaluating.'
        type: boolean
        default: false
      reconcile_open:
        description: 'Refresh every open PR after handling the triggering event. Required for a bounded caller queue.'
        type: boolean
        default: false
      required_workflows:
        description: 'Optional JSON array of {path, event, ref: head|merge}. ref binds Actions REST head_sha, not checkout SHA; PR merge checkouts commonly report head. Empty preserves legacy gating.'
        type: string
        default: '[]'
      persona_state:
        description: 'Private controller signal for the Grumpy review job.'
        type: string
        default: ''
      persona_pr:
        description: 'PR number for the exact-head persona signal.'
        type: string
        default: ''

# Inherit the caller's explicit token permissions. Requiring a new scope here
# before fleet callers receive it would make older callers fail to resolve.
# Updated callers grant statuses: read; older callers still fail closed on an
# unreadable status API without turning a permission rollout into a syntax error.

jobs:
  all-checks-passed:
    runs-on: ${{ fromJSON(inputs.runner-json != '' && inputs.runner-json || vars.PRIVATE_REPO_SELF_HOSTED == 'true' && '["self-hosted","Linux"]' || '["ubuntu-latest"]') }} # runner-keep-hosted (fallback for public callers and while PRIVATE_REPO_SELF_HOSTED is unset/false)
    timeout-minutes: 10
    steps:
      - name: Stage the evaluator
        id: evaluator
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "${JOB_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Missing or invalid job.workflow_sha"
            exit 1
          fi
          REF="${JOB_WORKFLOW_SHA}"
          # The evaluator imports the sibling module scripts/gatekeeper_workflows.py
          # at module load, so BOTH files must be staged from the SAME immutable
          # revision. Fetch each from raw.githubusercontent.com at
          # job.workflow_sha — never the caller's head, a branch name, or any
          # PR-controlled ref — and require every fetch to succeed with a
          # non-empty file before the evaluation step may run. The task-owned
          # outputs are removed first so a leftover copy (a stale RUNNER_TEMP, an
          # interrupted earlier fetch) can never satisfy staging.
          for file in pr-gatekeeper.py gatekeeper_workflows.py; do
            rm -f "${RUNNER_TEMP}/${file}"
          done
          for file in pr-gatekeeper.py gatekeeper_workflows.py; do
            curl -fsS \
              "https://raw.githubusercontent.com/seankoji-com/.github/${REF}/scripts/${file}" \
              -o "${RUNNER_TEMP}/${file}" \
              || { echo "::error::failed to fetch ${file} at ref ${REF}"; exit 1; }
            [ -s "${RUNNER_TEMP}/${file}" ] || {
              echo "::error::fetched ${file} is empty"; exit 1;
            }
          done

      - name: Evaluate and post the gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONA_REVIEW_REQUIRED: ${{ vars.PERSONA_REVIEW_REQUIRED }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SEED: ${{ inputs.seed }}
          PERSONA_STATE: ${{ inputs.persona_state }}
          PERSONA_PR: ${{ inputs.persona_pr }}
          REQUIRE_CI: ${{ inputs.reconcile_open }}
          GATEKEEPER_REQUIRED_WORKFLOWS: ${{ inputs.required_workflows }}
        run: |
          # review_run_id is caller-supplied public API and --review-run is
          # type=int: any non-integer would kill the step on argparse's usage
          # error before the gate script runs, posting no check run at all.
          # Guard the shape (as JOB_WORKFLOW_SHA does above) and fall back to
          # plain --sha evaluation so a bad value cannot suppress the check.
          args=()
          if [ "${REQUIRE_CI:-false}" = "true" ]; then args+=(--require-ci); fi
          # Replaced events still require every current PR to be refreshed.
          # One invocation shares destination tracking with the event path.
          if [ "${REQUIRE_CI:-false}" = "true" ] && [ "$SEED" != "true" ]; then args+=(--reconcile-open); fi
          if [ -n "$REVIEW_RUN_ID" ]; then
            # Match the whole string, not one line of it: a multiline value
            # such as $'123\ninvalid' would satisfy a per-line grep and still
            # reach argparse. Cap the length too; run ids are ~10 digits.
            if [[ "$REVIEW_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
              args+=(--review-run "$REVIEW_RUN_ID")
            else
              echo "::warning::Ignoring invalid review_run_id '${REVIEW_RUN_ID}'; evaluating by --sha"
            fi
          fi
          if [ "$SEED" = "true" ]; then args+=(--seed); fi
          if [[ "$PERSONA_STATE" =~ ^(running|failed)$ ]] && [[ "$PERSONA_PR" =~ ^[1-9][0-9]{0,11}$ ]]; then
            args+=(--persona-state "$PERSONA_STATE" --persona-pr "$PERSONA_PR")
          elif [ -n "$PERSONA_STATE" ] || [ -n "$PERSONA_PR" ]; then
            echo '::warning::Invalid persona signal inputs; continuing without persona signal'
          fi
          python3 "${RUNNER_TEMP}/pr-gatekeeper.py" \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${HEAD_SHA}" "${args[@]}"
