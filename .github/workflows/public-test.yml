name: Test public defaults

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest # runner-keep-hosted (runs only in this public repo; hosted minutes are free)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      # Pinned for WorkflowSyntaxTests; it skips the actionlint check if absent.
      # scripts/update_tool_pins.py rewrites these two values in a weekly PR;
      # keep each quoted on its own line.
      - name: Install actionlint
        env:
          PIN_ACTIONLINT: "1.7.12"
          PIN_ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${PIN_ACTIONLINT}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${PIN_ACTIONLINT}/${tarball}"
          echo "${PIN_ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      # The reusable workflows run scripts/*.py with the self-hosted runner's
      # own python3, and the jammy-based pools ship Python 3.10. This job runs
      # 3.12 on ubuntu-latest, so it cannot see 3.12-only syntax (PEP 701
      # nested-quote f-strings broke every org gate until #19). Compile the
      # runner scripts under the oldest supported interpreter. Keep these
      # steps last: setup-python changes which python3 later steps get.
      - name: Stage the native CI result step for Python 3.10
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path(".github/workflows/reusable-ci-result.yml").read_text())
          step = config["jobs"]["all-checks-passed"]["steps"][0]["run"]
          (Path(os.environ["RUNNER_TEMP"]) / "native-ci-result.sh").write_text(step)
          PY
      - name: Set up Python 3.10 (oldest self-hosted runner)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Compile runner scripts under Python 3.10
        run: python -m py_compile scripts/*.py actions/persona-status/*.py
      # py_compile only checks syntax. Loading each script as a module also
      # runs its module-level imports, so a 3.11+/3.12-only stdlib name
      # (itertools.batched, datetime.UTC, ...) fails here instead of on a
      # jammy runner. `__main__` blocks do not run, and scripts that are
      # only imported lazily (agent_readiness_git) are loaded too. Imports
      # inside function bodies are still not covered.
      - name: Load runner scripts under Python 3.10
        run: |
          python - <<'EOF'
          import importlib.util
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          paths = sorted(pathlib.Path("scripts").glob("*.py"))
          paths += sorted(pathlib.Path("actions/persona-status").glob("*.py"))
          for path in paths:
              name = path.stem.replace("-", "_")
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              print(f"loaded {path}")
          EOF
      - name: Execute native CI result under Python 3.10
        env:
          NEEDS_JSON: '{"test":{"result":"success"}}'
          EXPECTED_JOBS: '["test"]'
          SKIPPABLE_JOBS: '[]'
        run: |
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 10)'
          bash -euo pipefail "$RUNNER_TEMP/native-ci-result.sh"
          if NEEDS_JSON='{"test":{"result":"failure"}}' bash -euo pipefail "$RUNNER_TEMP/native-ci-result.sh" >/dev/null; then
            echo "::error::A failed dependency passed the native CI result under Python 3.10"
            exit 1
          fi
          if NEEDS_JSON='{"test":{"result":"skipped"}}' bash -euo pipefail "$RUNNER_TEMP/native-ci-result.sh" >/dev/null; then
            echo "::error::An undeclared skip passed the native CI result under Python 3.10"
            exit 1
          fi
          NEEDS_JSON='{"test":{"result":"skipped"}}' SKIPPABLE_JOBS='["test"]' bash -euo pipefail "$RUNNER_TEMP/native-ci-result.sh"
      - name: Execute persona publisher tests under Python 3.10
        run: python -m unittest discover -s tests -p 'test_persona_status.py'

  # Exercise same-revision native wiring without replacing the legacy required
  # producer. Its distinct caller ID gives a distinct check name.
  verify-ci-result:
    needs: [test]
    if: always()
    permissions: {}
    uses: ./.github/workflows/reusable-ci-result.yml
    with:
      needs_json: ${{ toJSON(needs) }}
      expected_jobs: '["test"]'
      runner-json: '["ubuntu-latest"]' # runner-keep-hosted (public repository smoke)
