name: Test public defaults

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  # Every repo in the org calls these workflows. A file GitHub cannot parse
  # (e.g. `continue-on-error` on a `uses:` job) fails at load time with no job
  # to go red, so lint before it can reach main.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      # Ignored: syntax actionlint does not know yet. `concurrency.queue` is
      # documented GitHub syntax; `job.workflow_sha` is the reusable's own SHA.
      - name: Lint workflows
        run: >-
          "${RUNNER_TEMP}/actionlint" -color
          -ignore 'unexpected key "queue" for "concurrency" section'
          -ignore 'property "workflow_sha" is not defined in object type \{check_run_id'
