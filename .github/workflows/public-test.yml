name: Test public defaults

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependency
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Run tests
        run: |
          python3 tests/test_agent_readiness.py
          python3 tests/test_pr_gatekeeper.py
          python3 tests/test_released_workflow.py
