name: Reusable Static Analysis

# Runs Semgrep and zizmor against the checked-out PR content. The caller may
# choose the runner. Private repositories must pass self-hosted labels; public
# repositories keep the GitHub-hosted default.
#
# Non-blocking by design: both the install and scan step in each job carry
# `continue-on-error: true`, so a tool failure never turns the check run red.
# Each job's final `if: always()` step records PASS/SCANNED vs.
# INSTALL-FAILED/NO-OUTPUT in the step summary so an install failure can never
# look identical to a clean scan with no findings.

on:
  workflow_call:
    inputs:
      # Keep the hosted default for public/fork callers. Private callers must
      # pass runner-json explicitly: github.event.repository is absent on
      # schedule, and no event-independent visibility context is available
      # before runner selection. See README.md#runner-selection for the gap.
      runner-json:
        description: 'JSON runner labels. Default: ubuntu-latest. Private callers must pass ["self-hosted","Linux"].'
        type: string
        default: '["ubuntu-latest"]'

# A reusable workflow can never hold more than its caller, so the caller must
# not declare a narrower `permissions:` block than this.
permissions:
  contents: read

# Scanner pins, defined once. scripts/update_tool_pins.py rewrites these lines
# in a weekly PR (Dependabot cannot read workflow env); keep each value quoted
# on its own line. The cache keys and install steps below read them from here.
env:
  PIN_PIP: "25.2"
  PIN_SEMGREP: "1.176.0"
  # The ~= release semgrep itself requires for its OpenTelemetry instrumentation.
  PIN_SEMGREP_OTEL: "0.58b0"
  PIN_ZIZMOR: "1.30.0"

jobs:
  semgrep:
    name: semgrep
    runs-on: ${{ fromJSON(inputs.runner-json) }} # runner-keep-hosted (public-compatible default; private callers must pass self-hosted runner-json)
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Avoid system pip mutation and unsupported --break-system-packages flags.
      # Fresh venvs isolate scanners; the cache stores downloads, never executables.
      - name: Prepare isolated Python environment
        id: python
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Scanners require Python >=3.10"'
          python3 -c 'import sys; print("version=" + ".".join(map(str, sys.version_info[:2])))' >> "$GITHUB_OUTPUT"
          python3 -m venv --clear "$RUNNER_TEMP/semgrep-venv" || { echo "::warning::Scanner requires working Python venv/ensurepip support on this runner"; exit 1; }
          result_dir="$(mktemp -d "$RUNNER_TEMP/semgrep-results.XXXXXX")"
          echo "result=$result_dir/results.json" >> "$GITHUB_OUTPUT"

      - name: Probe immutable scanner seed
        id: seed
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          # Publish a mode only after complete read-only verification succeeds.
          cache_mode="$(
          # Embedded canonical helper bytes avoid a mutable fetch or caller script.
          "$RUNNER_TEMP/semgrep-venv/bin/python3" -I -B - "semgrep" <<'PY'
          import base64, gzip, hashlib, sys
          source = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(source).hexdigest() == "7e909bcc76d2eb19da3776bdb81e8b37f03f6d25aef57204ec1206836cfd9878", "Scanner helper checksum mismatch"
          sys.argv = ["scanner_seed.py", "probe", *sys.argv[1:]]
          exec(compile(source, "scanner_seed.py", "exec"), {"__name__": "__main__"})
          PY
          )"
          printf '%s\n' "$cache_mode" >> "$GITHUB_OUTPUT"

      - name: Restore scanner downloads
        id: cache
        if: steps.seed.outcome == 'success' && steps.seed.outputs.cache_mode == 'fallback'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/semgrep-pip-cache
          key: scanner-pip-v2-${{ runner.environment }}-trusted-default-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-semgrep-${{ env.PIN_SEMGREP }}-otel-${{ env.PIN_SEMGREP_OTEL }}-zizmor-${{ env.PIN_ZIZMOR }}-pip-${{ env.PIN_PIP }}

      - name: Install Semgrep
        id: install
        if: steps.python.outcome == 'success' && steps.seed.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/semgrep-pip-cache
        run: |
          set -euo pipefail
          # Embedded canonical helper bytes avoid a mutable fetch or caller script.
          "$RUNNER_TEMP/semgrep-venv/bin/python3" -I -B - "semgrep" "$RUNNER_TEMP/semgrep-venv" <<'PY'
          import base64, gzip, hashlib, sys
          source = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(source).hexdigest() == "7e909bcc76d2eb19da3776bdb81e8b37f03f6d25aef57204ec1206836cfd9878", "Scanner helper checksum mismatch"
          sys.argv = ["scanner_seed.py", "install", *sys.argv[1:]]
          exec(compile(source, "scanner_seed.py", "exec"), {"__name__": "__main__"})
          PY
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"


      - name: Run Semgrep scan
        id: scan
        if: steps.install.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: 'off'
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config p/security-audit --config p/secrets \
            --metrics=off --json --output "$RESULT_FILE" .

      # No bare `set -e`: this is the only step in the job not covered by
      # continue-on-error, so a broken result file must never fail the job.
      - name: Record scan outcome
        timeout-minutes: 1
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          count=""
          if [ "$INSTALL_OUTCOME" = success ] && { [ "$SCAN_OUTCOME" = success ] || [ "$SCAN_OUTCOME" = failure ]; } && [ -f "$RESULT_FILE" ]; then
            count="$(jq -er '.results | if type == "array" then length else error("invalid results") end' "$RESULT_FILE" 2>/dev/null || true)"
          fi
          {
            echo "### Semgrep"
            if [ -n "$count" ]; then
              echo "- SCANNED: $count finding(s); scan outcome: $SCAN_OUTCOME"
            else
              echo "- INSTALL-FAILED or NO-OUTPUT: install=$INSTALL_OUTCOME scan=$SCAN_OUTCOME; inspect logs"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

      - name: Upload results artifact
        timeout-minutes: 1
        if: always() && steps.install.outcome == 'success' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && steps.python.outputs.result != ''
        # Non-gating. An artifact-service failure must not fail the scan job;
        # findings are already in the step summary.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-results
          path: ${{ steps.python.outputs.result }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Save scanner downloads
        if: success() && steps.seed.outcome == 'success' && steps.seed.outputs.cache_mode == 'fallback' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.install.outcome == 'success' && steps.scan.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-primary-key != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/semgrep-pip-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  zizmor:
    name: zizmor
    runs-on: ${{ fromJSON(inputs.runner-json) }} # runner-keep-hosted (public-compatible default; private callers must pass self-hosted runner-json)
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated Python environment
        id: python
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Scanners require Python >=3.10"'
          python3 -c 'import sys; print("version=" + ".".join(map(str, sys.version_info[:2])))' >> "$GITHUB_OUTPUT"
          python3 -m venv --clear "$RUNNER_TEMP/zizmor-venv" || { echo "::warning::Scanner requires working Python venv/ensurepip support on this runner"; exit 1; }
          result_dir="$(mktemp -d "$RUNNER_TEMP/zizmor-results.XXXXXX")"
          echo "result=$result_dir/results.json" >> "$GITHUB_OUTPUT"

      - name: Probe immutable scanner seed
        id: seed
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          # Publish a mode only after complete read-only verification succeeds.
          cache_mode="$(
          # Embedded canonical helper bytes avoid a mutable fetch or caller script.
          "$RUNNER_TEMP/zizmor-venv/bin/python3" -I -B - "zizmor" <<'PY'
          import base64, gzip, hashlib, sys
          source = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(source).hexdigest() == "7e909bcc76d2eb19da3776bdb81e8b37f03f6d25aef57204ec1206836cfd9878", "Scanner helper checksum mismatch"
          sys.argv = ["scanner_seed.py", "probe", *sys.argv[1:]]
          exec(compile(source, "scanner_seed.py", "exec"), {"__name__": "__main__"})
          PY
          )"
          printf '%s\n' "$cache_mode" >> "$GITHUB_OUTPUT"

      - name: Restore scanner downloads
        id: cache
        if: steps.seed.outcome == 'success' && steps.seed.outputs.cache_mode == 'fallback'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zizmor-pip-cache
          key: scanner-pip-v2-${{ runner.environment }}-trusted-default-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-zizmor-${{ env.PIN_ZIZMOR }}-semgrep-${{ env.PIN_SEMGREP }}-otel-${{ env.PIN_SEMGREP_OTEL }}-pip-${{ env.PIN_PIP }}

      - name: Install zizmor
        id: install
        if: steps.python.outcome == 'success' && steps.seed.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/zizmor-pip-cache
        run: |
          set -euo pipefail
          # Embedded canonical helper bytes avoid a mutable fetch or caller script.
          "$RUNNER_TEMP/zizmor-venv/bin/python3" -I -B - "zizmor" "$RUNNER_TEMP/zizmor-venv" <<'PY'
          import base64, gzip, hashlib, sys
          source = gzip.decompress(base64.b64decode(""))
          assert hashlib.sha256(source).hexdigest() == "7e909bcc76d2eb19da3776bdb81e8b37f03f6d25aef57204ec1206836cfd9878", "Scanner helper checksum mismatch"
          sys.argv = ["scanner_seed.py", "install", *sys.argv[1:]]
          exec(compile(source, "scanner_seed.py", "exec"), {"__name__": "__main__"})
          PY
          echo "$RUNNER_TEMP/zizmor-venv/bin" >> "$GITHUB_PATH"


      # No job-level `if: hashFiles(...)` guard here: that would evaluate
      # before checkout, always see an empty workspace, and silently disable
      # this job forever. Relying instead on zizmor's own no-op behavior when
      # .github/workflows/ is missing or empty, covered by this step's own
      # continue-on-error.
      - name: Run zizmor scan
        id: scan
        if: steps.install.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        env:
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --no-online-audits --format json .github/workflows > "$RESULT_FILE"

      - name: Record scan outcome
        timeout-minutes: 1
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          count=""
          if [ "$INSTALL_OUTCOME" = success ] && { [ "$SCAN_OUTCOME" = success ] || [ "$SCAN_OUTCOME" = failure ]; } && [ -f "$RESULT_FILE" ]; then
            count="$(jq -er '. | if type == "array" then length else error("invalid results") end' "$RESULT_FILE" 2>/dev/null || true)"
          fi
          {
            echo "### zizmor"
            if [ -n "$count" ]; then
              echo "- SCANNED: $count finding(s); scan outcome: $SCAN_OUTCOME"
            else
              echo "- INSTALL-FAILED or NO-OUTPUT: install=$INSTALL_OUTCOME scan=$SCAN_OUTCOME; inspect logs"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

      - name: Upload results artifact
        timeout-minutes: 1
        if: always() && steps.install.outcome == 'success' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && steps.python.outputs.result != ''
        # Non-gating. Findings are already in the step summary above.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-results
          path: ${{ steps.python.outputs.result }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Save scanner downloads
        if: success() && steps.seed.outcome == 'success' && steps.seed.outputs.cache_mode == 'fallback' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.install.outcome == 'success' && steps.scan.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-primary-key != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zizmor-pip-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
