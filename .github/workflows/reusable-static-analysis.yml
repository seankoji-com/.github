name: Reusable Static Analysis

# Runs Semgrep and zizmor against the checked-out PR content. The caller chooses
# the runner. Public repositories must use the GitHub-hosted default.
#
# Non-blocking by design: both the install and scan step in each job carry
# `continue-on-error: true`, so a tool failure never turns the check run red.
# Each job's final `if: always()` step records PASS/SCANNED vs.
# INSTALL-FAILED/NO-OUTPUT in the step summary so an install failure can never
# look identical to a clean scan with no findings.

on:
  workflow_call:
    inputs:
      runner-json:
        description: 'JSON runner labels. Private callers may opt into self-hosted runners.'
        type: string
        default: '["ubuntu-latest"]'

# A reusable workflow can never hold more than its caller, so the caller must
# not declare a narrower `permissions:` block than this.
permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Avoid system pip mutation and unsupported --break-system-packages flags.
      # Fresh venvs isolate scanners; the cache stores downloads, never executables.
      - name: Prepare isolated Python environment
        id: python
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Scanners require Python >=3.10"'
          python3 -c 'import sys; print("version=" + ".".join(map(str, sys.version_info[:2])))' >> "$GITHUB_OUTPUT"
          python3 -m venv --clear "$RUNNER_TEMP/semgrep-venv" || { echo "::warning::Scanner requires working Python venv/ensurepip support on this runner"; exit 1; }
          result_dir="$(mktemp -d "$RUNNER_TEMP/semgrep-results.XXXXXX")"
          echo "result=$result_dir/results.json" >> "$GITHUB_OUTPUT"

      - name: Restore scanner downloads
        id: cache
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-pip-cache
          key: scanner-pip-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-semgrep-1.176.0-pip-25.2

      - name: Install Semgrep
        id: install
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/scanner-pip-cache
        run: |
          set -euo pipefail
          scanner_python="$RUNNER_TEMP/semgrep-venv/bin/python"
          "$scanner_python" -m pip install --disable-pip-version-check --no-input \
            --progress-bar off --timeout 30 --retries 2 --only-binary=:all: "pip==25.2"
          # Semgrep 1.176 uses SDK 1.37 / semantic-conventions 0.58b0.
          # Match instrumentation to that SDK instead of backtracking newer releases.
          "$scanner_python" -m pip install --disable-pip-version-check --no-input \
            --progress-bar off --timeout 30 --retries 2 --only-binary=:all: "semgrep==1.176.0" \
            "opentelemetry-instrumentation-requests==0.58b0" \
            "opentelemetry-instrumentation-threading==0.58b0"
          "$scanner_python" -m pip check
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Save scanner downloads
        if: steps.install.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-primary-key != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/scanner-pip-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Run Semgrep scan
        id: scan
        if: steps.install.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        env:
          SEMGREP_SEND_METRICS: 'off'
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          set -uo pipefail
          semgrep scan --config p/security-audit --config p/secrets \
            --metrics=off --json --output "$RESULT_FILE" .

      # No bare `set -e`: this is the only step in the job not covered by
      # continue-on-error, so a broken result file must never fail the job.
      - name: Record scan outcome
        timeout-minutes: 1
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          count=""
          if [ "$INSTALL_OUTCOME" = success ] && { [ "$SCAN_OUTCOME" = success ] || [ "$SCAN_OUTCOME" = failure ]; } && [ -f "$RESULT_FILE" ]; then
            count="$(jq -er '.results | if type == "array" then length else error("invalid results") end' "$RESULT_FILE" 2>/dev/null || true)"
          fi
          {
            echo "### Semgrep"
            if [ -n "$count" ]; then
              echo "- SCANNED: $count finding(s); scan outcome: $SCAN_OUTCOME"
            else
              echo "- INSTALL-FAILED or NO-OUTPUT: install=$INSTALL_OUTCOME scan=$SCAN_OUTCOME; inspect logs"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

      - name: Upload results artifact
        timeout-minutes: 1
        if: always() && steps.install.outcome == 'success' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && steps.python.outputs.result != ''
        # Non-gating. An artifact-service failure must not fail the scan job;
        # findings are already in the step summary.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results
          path: ${{ steps.python.outputs.result }}
          if-no-files-found: ignore
          retention-days: 30

  zizmor:
    name: zizmor
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare isolated Python environment
        id: python
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Scanners require Python >=3.10"'
          python3 -c 'import sys; print("version=" + ".".join(map(str, sys.version_info[:2])))' >> "$GITHUB_OUTPUT"
          python3 -m venv --clear "$RUNNER_TEMP/zizmor-venv" || { echo "::warning::Scanner requires working Python venv/ensurepip support on this runner"; exit 1; }
          result_dir="$(mktemp -d "$RUNNER_TEMP/zizmor-results.XXXXXX")"
          echo "result=$result_dir/results.json" >> "$GITHUB_OUTPUT"

      - name: Restore scanner downloads
        id: cache
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner-pip-cache
          key: scanner-pip-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-zizmor-1.30.0-pip-25.2

      - name: Install zizmor
        id: install
        if: steps.python.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/scanner-pip-cache
        run: |
          set -euo pipefail
          scanner_python="$RUNNER_TEMP/zizmor-venv/bin/python"
          "$scanner_python" -m pip install --disable-pip-version-check --no-input \
            --progress-bar off --timeout 30 --retries 2 --only-binary=:all: "pip==25.2"
          "$scanner_python" -m pip install --disable-pip-version-check --no-input \
            --progress-bar off --timeout 30 --retries 2 --only-binary=:all: "zizmor==1.30.0"
          "$scanner_python" -m pip check
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --version
          echo "$RUNNER_TEMP/zizmor-venv/bin" >> "$GITHUB_PATH"

      - name: Save scanner downloads
        if: steps.install.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-primary-key != ''
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/scanner-pip-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # No job-level `if: hashFiles(...)` guard here: that would evaluate
      # before checkout, always see an empty workspace, and silently disable
      # this job forever. Relying instead on zizmor's own no-op behavior when
      # .github/workflows/ is missing or empty, covered by this step's own
      # continue-on-error.
      - name: Run zizmor scan
        id: scan
        if: steps.install.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        env:
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          set -uo pipefail
          zizmor --no-online-audits --format json .github/workflows > "$RESULT_FILE"

      - name: Record scan outcome
        timeout-minutes: 1
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          RESULT_FILE: ${{ steps.python.outputs.result }}
        run: |
          count=""
          if [ "$INSTALL_OUTCOME" = success ] && { [ "$SCAN_OUTCOME" = success ] || [ "$SCAN_OUTCOME" = failure ]; } && [ -f "$RESULT_FILE" ]; then
            count="$(jq -er '. | if type == "array" then length else error("invalid results") end' "$RESULT_FILE" 2>/dev/null || true)"
          fi
          {
            echo "### zizmor"
            if [ -n "$count" ]; then
              echo "- SCANNED: $count finding(s); scan outcome: $SCAN_OUTCOME"
            else
              echo "- INSTALL-FAILED or NO-OUTPUT: install=$INSTALL_OUTCOME scan=$SCAN_OUTCOME; inspect logs"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0

      - name: Upload results artifact
        timeout-minutes: 1
        if: always() && steps.install.outcome == 'success' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') && steps.python.outputs.result != ''
        # Non-gating. Findings are already in the step summary above.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zizmor-results
          path: ${{ steps.python.outputs.result }}
          if-no-files-found: ignore
          retention-days: 30
