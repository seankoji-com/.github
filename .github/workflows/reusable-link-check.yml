name: Reusable Link Checker

on:
  workflow_call:
    inputs:
      config-file:
        description: 'Path to lychee config file'
        type: string
        default: '.lychee.toml'
      args:
        description: 'Additional lychee arguments'
        type: string
        default: '--verbose --no-progress "./**/*.md"'
      runner-json:
        description: 'JSON runner labels. Private callers may opt into self-hosted runners.'
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    name: Check Links
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: ${{ inputs.args }}
          config: ${{ inputs.config-file }}
          fail: true
