name: Reusable CI Result

# The caller must use if: always() and list every retained validation job in
# needs, in this same workflow. This job reads native results; it posts no API
# check and cannot discover dependencies omitted by the caller. A skipped job
# passes only when skippable_jobs declares it AND the skip_authority job
# succeeded with an output named after that job set to exactly 'false'. GitHub
# also reports skipped when an upstream dependency fails, so a declaration alone
# does not prove the skip was intended. Outputs are otherwise ignored: only
# needs[skip_authority].outputs[<declared job>] is read, compared with 'false',
# and never logged.
on:
  workflow_call:
    inputs:
      needs_json:
        description: 'Native dependency results, passed as toJSON(needs). Only needs[skip_authority].outputs[<declared job>] is read, compared with ''false'', and never logged.'
        required: true
        type: string
      expected_jobs:
        description: 'Literal nonempty JSON array of all direct dependency job IDs (lowercase). Must exactly match needs_json keys.'
        required: true
        type: string
      skippable_jobs:
        description: 'Literal JSON array of expected_jobs IDs whose skipped result may pass (for example job-level path filters). A skip passes only when skip_authority confirms it. Failure and cancellation still fail. Default: none.'
        required: false
        type: string
        default: '[]'
      skip_authority:
        description: 'Job ID in expected_jobs, not in skippable_jobs, that proves each declared skip was intended. Required when skippable_jobs is nonempty. It must succeed and set an output named after each declared job to ''true'' or ''false''; only ''false'' lets that skip pass. Default: none.'
        required: false
        type: string
        default: ''
      runner-json:
        description: 'JSON runner labels. Omitted: ["self-hosted","Linux"] when PRIVATE_REPO_SELF_HOSTED=true, otherwise ubuntu-latest. Explicit labels override routing.'
        type: string
        default: ''

permissions: {}

jobs:
  all-checks-passed:
    name: all-checks-passed
    runs-on: ${{ fromJSON((inputs.runner-json != '' && inputs.runner-json) || (vars.PRIVATE_REPO_SELF_HOSTED == 'true' && '["self-hosted","Linux"]') || '["ubuntu-latest"]') }} # runner-keep-hosted (fallback for public callers and while PRIVATE_REPO_SELF_HOSTED is unset/false)
    timeout-minutes: 1
    steps:
      - name: Require every native dependency to succeed
        shell: bash
        env:
          NEEDS_JSON: ${{ inputs.needs_json }}
          EXPECTED_JOBS: ${{ inputs.expected_jobs }}
          SKIPPABLE_JOBS: ${{ inputs.skippable_jobs }}
          SKIP_AUTHORITY: ${{ inputs.skip_authority }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import re
          import sys

          def reject(message):
              print("::error::" + message)
              sys.exit(1)

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result

          try:
              expected = json.loads(os.environ["EXPECTED_JOBS"], object_pairs_hook=unique_object)
              needs = json.loads(os.environ["NEEDS_JSON"], object_pairs_hook=unique_object)
              skippable = json.loads(os.environ["SKIPPABLE_JOBS"], object_pairs_hook=unique_object)
              authority = os.environ["SKIP_AUTHORITY"]
          except (ValueError, KeyError, RecursionError):
              reject("Invalid native CI result JSON")

          def job_id(value):
              return isinstance(value, str) and re.fullmatch(r"[a-z_][a-z0-9_-]*", value) is not None

          def distinct_job_ids(value):
              return (isinstance(value, list) and all(job_id(job) for job in value)
                      and len(set(value)) == len(value))

          if not distinct_job_ids(expected) or not expected:
              reject("expected_jobs must be a nonempty list of distinct lowercase job IDs")
          if not distinct_job_ids(skippable):
              reject("skippable_jobs must be a list of distinct lowercase job IDs")
          if not set(skippable) <= set(expected):
              reject("skippable_jobs must only list IDs from expected_jobs")
          if authority == "":
              if skippable:
                  reject("skip_authority is required when skippable_jobs is nonempty")
          elif not job_id(authority):
              reject("skip_authority must be a lowercase job ID")
          elif authority not in expected:
              reject("skip_authority must be listed in expected_jobs")
          elif authority in skippable:
              reject("skip_authority must not be listed in skippable_jobs")
          if not isinstance(needs, dict) or set(needs) != set(expected):
              reject("Native dependency IDs do not match expected_jobs")

          def unconfirmed_skip(job):
              # Positive proof only: the authority succeeded and set this job's
              # output to exactly 'false'. Output values are never printed.
              record = needs[authority]
              if not isinstance(record, dict) or record.get("result") != "success":
                  return "skip_authority did not succeed"
              outputs = record.get("outputs")
              if not isinstance(outputs, dict) or outputs.get(job) != "false":
                  return "skip_authority did not mark it not required"
              return None

          failed = False
          skipped = 0
          for job in expected:
              record = needs[job]
              result = record.get("result") if isinstance(record, dict) else None
              if result == "skipped" and job in skippable:
                  reason = unconfirmed_skip(job)
                  if reason:
                      print("::error::CI dependency " + job + " did not succeed (skipped; " + reason + ")")
                      failed = True
                  else:
                      print("CI dependency " + job + " skipped (confirmed by skip_authority)")
                      skipped += 1
              elif result != "success":
                  # Never print outputs, raw JSON or untrusted result strings.
                  label = result if result in ("failure", "cancelled", "skipped") else "invalid result"
                  hint = {"cancelled": "; possibly a superseded run",
                          "skipped": "; not declared in skippable_jobs"}.get(label, "")
                  print("::error::CI dependency " + job + " did not succeed (" + label + hint + ")")
                  failed = True
          if failed:
              sys.exit(1)
          if skipped:
              print("All " + str(len(expected)) + " native CI dependencies passed ("
                    + str(skipped) + " declared skip(s))")
          else:
              print("All " + str(len(expected)) + " native CI dependencies succeeded")
          PY
