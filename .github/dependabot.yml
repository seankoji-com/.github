# Dependabot version updates for this repository. Each consuming repository
# still needs its own ecosystem-specific .github/dependabot.yml.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type:chore"
      - "dependencies"
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # requirements-test.txt (public-test.yml). Scanner, pip and actionlint pins
  # live in workflow env, which Dependabot cannot read; see docs/tool-pins.md.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type:chore"
      - "dependencies"
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch
